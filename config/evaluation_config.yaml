        - "/grammar-punctuation-and-conventions/shortened-words-and-phrases/abbreviations"
        - "/grammar-punctuation-and-conventions/shortened-words-and-phrases/acronyms-and-initialisms"
        - "/grammar-punctuation-and-conventions/shortened-words-and-phrases/contractions"
