# config/evaluation_config.yaml
# Main configuration for the speech evaluation framework

# Model configuration - which models to use for different roles
models:
  junior:
    provider: "openai" # google, openai, anthropic
    model: "gpt-3.5-turbo" # Cost-effective for junior tasks
    temperature: 0.3
    max_tokens: 2000

  senior:
    provider: "openai"
    model: "gpt-4o-mini" # Good balance of cost and capability
    temperature: 0.5
    max_tokens: 4000

  editor:
    provider: "openai"
    model: "gpt-4o" # Best model for final synthesis
    temperature: 0.7
    max_tokens: 8000

# Concurrency and rate limiting
performance:
  max_concurrent_juniors: 10 # Max parallel page evaluations
  rate_limit:
    requests_per_minute: 20
    burst_size: 5
  request_timeout: 30 # seconds

# Rate limits per provider/model (optional - will use defaults if not specified)
rate_limits:
  openai:
    gpt-3.5-turbo:
      rate: 3.0 # requests per second
      burst: 5 # max burst
    gpt-4o-mini:
      rate: 2.0
      burst: 3
    gpt-4o:
      rate: 1.0
      burst: 2
  google:
    gemma-3-27b-it:
      rate: 10.0
      burst: 5

# Caching configuration
cache:
  enabled: true
  ttl_hours: 24 # How long to cache fetched pages
  max_size_mb: 100
  storage_path: "./cache"

# Report configuration
reports:
  junior:
    verbosity: "detailed" # minimal, standard, detailed
    include_quotes: true
    max_issues_per_page: 10

  senior:
    verbosity: "standard"
    consolidate_similar: true
    priority_threshold: 0.7 # Only include issues above this severity

  editor:
    format: "executive" # executive, detailed, technical
    max_recommendations: 5
    include_links: true

# Style Guide evaluation settings
style_guide:
