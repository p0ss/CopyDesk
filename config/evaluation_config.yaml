# Brand tone evaluation settings
brand_tone:
  documents:
    - name: "Services Australia Strategy 2030"
      url: "https://www.servicesaustralia.gov.au/strategy-2030"
      type: "pdf"

    - name: "Brand Voice Guidelines"
      url: "https://www.servicesaustralia.gov.au/brand-guidelines"
      type: "web"

    - name: "Customer Service Charter"
      url: "https://www.servicesaustralia.gov.au/customer-service-charter"
      type: "web"

  tone_attributes:
    - "helpful"
    - "clear"
    - "respectful"
    - "accessible"
    - "professional"
    - "empathetic"

# Fact checking settings
fact_check:
  services_registry: "./config/services_registry.yaml"

  # Placeholder for Rules as Code integration
  rules_engine:
    enabled: false
    endpoint: "https://rules.gov.au/api/v1"

  # URL checking configuration
  url_checker:
    follow_redirects: true
    check_archived: false
    timeout: 15

# Output formatting
output:
  formats:
    - "markdown"
    - "json"
    - "html"

  markdown:
    include_toc: true
    use_tables: true
    highlight_severity: true

# Logging and monitoring
logging:
  level: "INFO" # DEBUG, INFO, WARNING, ERROR
  file: "./logs/evaluation.log"
  max_size_mb: 50
  retention_days: 30

  # Track costs
  cost_tracking:
    enabled: true
    alert_threshold_usd: 10.0

# MCP server (ground truth fragments)
mcp_server:
  # Default MCP HTTP bridge base URL (overridden by MCP_SERVER_URL env var)
  base_url: "http://localhost:8081"

# Fact-check via fragments
fact_check_fragments:
  enabled: true
  per_page: 8
