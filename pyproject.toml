[tool.poetry]
name = "copydesk"
version = "0.2.0"
description = "AI-powered content evaluation system with Material Design web interface for checking government content compliance"
authors = ["CopyDesk Team"]
readme = "README.md"
packages = [{include = "evaluators"}, {include = "utils"}]

[tool.poetry.scripts]
copydesk-web = "app:main"

[tool.poetry.dependencies]
python = "^3.11"
aiohttp = "^3.12.14"
httpx = "^0.28.1"
beautifulsoup4 = "^4.13.4"
lxml = "^6.0.0"
openai = "^1.97.0"
google-generativeai = "^0.8.5"
anthropic = "^0.18.0"
mcp = "^1.12.0"
python-dotenv = "^1.1.1"
pyyaml = "^6.0.2"
aiofiles = "^23.0.0"
cachetools = "^5.3.0"
flask = "^3.0.0"
flask-socketio = "^5.3.0"
flask-cors = "^4.0.0"
python-socketio = "^5.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^24.0.0"
flake8 = "^6.0.0"
mypy = "^1.8.0"

[tool.poetry.group.production]
optional = true

[tool.poetry.group.production.dependencies]
gunicorn = "^21.2.0"
eventlet = "^0.33.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
